<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G13 Bookstore</title>
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <div class="container">
    <div class="left-section">
      <div class="auth-container">
        <div class="auth-tabs">
          <button class="tab-button active" onclick="showTab('login')">Login</button>
          <button class="tab-button" onclick="showTab('register')">Register</button>
          <button class="tab-button" onclick="showTab('reset')">Reset Password</button>
        </div>

        <section id="login-section" class="auth-section active">
          <h2>LOGIN</h2>
          <form id="loginForm" method="POST" action="login.php">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="role">Login as:</label>
            <select id="role" name="role" class="styled-select" required>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>

            <button type="submit">Login</button>
          </form>
        </section>

        <section id="register-section" class="auth-section">
          <h2>Register</h2>
          <form id="registerForm" action="register.php" method="POST">
            <label for="reg_name">Full Name:</label>
            <input type="text" id="reg_name" name="name" required>

            <label for="reg_username">Username (Recommend to be same as your Full Name): </label>
            <input type="text" id="reg_username" name="username" required>

            <label for="reg_email">Email:</label>
            <input type="email" id="reg_email" name="email" required>

            <label for="reg_password">Password:</label>
            <input type="password" id="reg_password" name="password" required minlength="6">

            <label for="reg_confirm_password">Confirm Password:</label>
            <input type="password" id="reg_confirm_password" name="confirm_password" required minlength="6">

            <!-- Hidden role field (defaults to 'user') -->
            <input type="hidden" name="role" value="user">

            <button type="submit">Register</button>
          </form>
        </section>

        <section id="reset-section" class="auth-section">
          <h2>Reset Password</h2>
          <form id="resetForm" method="POST" action="login.php">
            <label for="reset_email">Email:</label>
            <input type="email" id="reset_email" name="reset_email" required>

            <label for="reset_new_password">New Password:</label>
            <input type="password" id="reset_new_password" name="reset_new_password" required minlength="6">

            <label for="reset_confirm_password">Confirm Password:</label>
            <input type="password" id="reset_confirm_password" name="reset_confirm_password" required minlength="6">

            <button type="submit" name="reset_password" value="1">Reset Password</button>
          </form>
        </section>
      </div>
    </div>

    <div class="right-section">
      <header>
        <h1>📚G13 Bookstore📚<br>Lend and read books!</h1>
      </header>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
